[project]
name = "iterlog"
version = "3.0.0"
description = "Evidence-backed development recaps for Codex and Claude Code with pre-compaction capture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iterlog contributors" }]
keywords = ["codex", "claude-code", "iterlog", "development-recap", "change-log", "productivity"]

[project.urls]
Documentation = "https://developers.openai.com/codex/hooks"
ClaudeCode = "https://code.claude.com/docs/en/plugins-reference"

[tool.unittest]
start-directory = "tests"
