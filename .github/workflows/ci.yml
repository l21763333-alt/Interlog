name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check launcher syntax
        run: node --check plugins/iterlog/tools/run_iterlog.js
      - name: Check POSIX launcher syntax
        if: runner.os != 'Windows'
        run: sh -n plugins/iterlog/tools/run_iterlog.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
